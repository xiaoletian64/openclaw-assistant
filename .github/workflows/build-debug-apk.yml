name: Build Debug APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Stable debug keystore
        run: |
          mkdir -p $HOME/.android
          echo "" | base64 -d > $HOME/.android/debug.keystore
      - name: Stub google-services.json
        run: |
          cat > app/google-services.json <<'EOT'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "openclaw-assistant-stub",
              "storage_bucket": "openclaw-assistant-stub.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:1234567890abcdef123456",
                  "android_client_info": {
                    "package_name": "com.openclaw.assistant.debug"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyStubKeyForBuildOnly1234567890abc"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOT
      - name: Build standard debug APK
        env:
          FIREBASE_ENABLED: false
        run: ./gradlew assembleStandardDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: assistant-standard-debug-apk
          path: app/build/outputs/apk/standard/debug/*.apk
